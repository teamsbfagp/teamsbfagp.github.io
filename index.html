<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Hub Portal - Secure Access</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f5f5f5; color: #333; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        /* Login Screen Layout */
        #login-screen { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        #login-screen h2 { color: #464775; margin-bottom: 20px; font-size: 24px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 600; color: #555; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccd0d5; border-radius: 4px; font-size: 15px; }
        .input-group input:focus { border-color: #464775; outline: none; }
        
        /* 2FA Container (Hidden by default) */
        #tfa-container { display: none; margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 15px; }
        
        /* Buttons */
        .btn { width: 100%; padding: 12px; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-primary { background-color: #464775; color: white; }
        .btn-primary:hover { background-color: #3b3c63; }
        .btn-code { background-color: #f0f0f7; color: #464775; border: 1px solid #464775; margin-bottom: 10px; font-size: 14px; padding: 8px; }
        .btn-code:hover { background-color: #e2e2f6; }
        
        #error-msg { color: #d9534f; font-size: 14px; margin-top: 10px; display: none; }

        /* Dashboard App Interface (Hidden until login complete) */
        #app-dashboard { display: none; width: 100%; height: 100vh; grid-template-columns: 220px 1fr; }
        .sidebar { background-color: #464775; color: white; display: flex; flex-direction: column; padding: 20px 10px; }
        .sidebar h2 { font-size: 18px; margin-bottom: 25px; text-align: center; border-bottom: 1px solid #6264a7; padding-bottom: 10px; }
        .sidebar a { color: #e2e2f6; text-decoration: none; padding: 12px; border-radius: 4px; margin-bottom: 8px; display: block; font-weight: 500; }
        .sidebar a:hover { background-color: #6264a7; color: white; }
        .logout-btn { margin-top: auto; background: transparent; border: 1px solid #e2e2f6; color: white; padding: 8px; border-radius: 4px; cursor: pointer; }

        .main-content { display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 60px 1fr; height: 100vh; width: 100%; }
        .header { grid-column: span 2; background-color: white; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 20px; font-weight: bold; color: #464775; }
        .doc-section { padding: 20px; overflow-y: auto; background-color: #f0f0f7; }
        .chat-section { border-left: 1px solid #e0e0e0; background-color: white; display: flex; flex-direction: column; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .widget-wrapper { height: 500px; margin-top: 10px; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- STAGE 1: PORTAL LOGIN SCREEN -->
    <div id="login-screen">
        <h2>Teams Hub Sign-In</h2>
        
        <!-- Step A: Credentials -->
        <div id="credentials-form">
            <div class="input-group">
                <label for="username">Email Address</label>
                <input type="email" id="username" placeholder="name@outlook.com">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button type="button" class="btn btn-primary" onclick="verifyCredentials()">Next</button>
        </div>

        <!-- Step B: Multi-Factor Authentication Field (Triggered by Next) -->
        <div id="tfa-container">
            <button type="button" class="btn btn-code" onclick="simulateSendCode()">[Send Code]</button>
            <div class="input-group">
                <label for="2fa-code">Enter 6-Digit 2FA Code</label>
                <input type="text" id="2fa-code" maxlength="6" placeholder="000000">
            </div>
            <button type="button" class="btn btn-primary" onclick="verify2FA()">Verify & Enter</button>
        </div>

        <div id="error-msg">Invalid credentials. Please try again.</div>
    </div>

    <!-- STAGE 2: LIVE TEAM WORKSPACE (Revealed after verification) -->
    <div id="app-dashboard">
        <div class="sidebar">
            <h2>👥 Team Hub</h2>
            <a href="#" style="background-color: #6264a7;">💬 General Feed</a>
            <a href="#">📅 Shared Calendar</a>
            <button class="logout-btn" onclick="window.location.reload()">🔒 Sign Out</button>
        </div>
        <div class="main-content">
            <div class="header">
                <span>📋 Dashboard Workspace</span>
                <span style="font-size:14px; color:#666;" id="user-display"></span>
            </div>
            <div class="doc-section">
                <div class="card">
                    <h3>📌 Pinboard & Active Files</h3>
                    <div class="widget-wrapper">
                        <iframe src="https://google.com"></iframe>
                    </div>
                </div>
            </div>
            <div class="chat-section">
                <div style="padding: 15px; border-bottom:1px solid #e0e0e0; font-weight:600;">Channel Chat</div>
                <iframe src="https://discord.com" width="100%" height="100%" allowtransparency="true" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"></iframe>
            </div>
        </div>
    </div>

    <!-- SECURITY CONTROL LOGIC -->
    <script>
        // CONFIGURATION: Set your specific team access keys here
        const TARGET_USER = "6303milh@outlook.com";
        const TARGET_PASS = "Password123"; // Replace with your desired team password
        const TARGET_2FA  = "123456";

        function verifyCredentials() {
            const userIn = document.getElementById("username").value;
            const passIn = document.getElementById("password").value;
            const errorElement = document.getElementById("error-msg");

            if (userIn === TARGET_USER && passIn === TARGET_PASS) {
                errorElement.style.display = "none";
                document.getElementById("credentials-form").style.display = "none";
                document.getElementById("tfa-container").style.display = "block";
            } else {
                errorElement.innerText = "Incorrect username or password.";
                errorElement.style.display = "block";
            }
        }

        function simulateSendCode() {
            alert("A simulated security authorization token code has been dispatched to your device.");
        }

        function verify2FA() {
            const codeIn = document.getElementById("2fa-code").value;
            const errorElement = document.getElementById("error-msg");

            if (codeIn === TARGET_2FA) {
                // Clear validation panel, change body display, reveal system dashboard
                document.getElementById("login-screen").style.display = "none";
                document.body.style.display = "block"; 
                document.getElementById("app-dashboard").style.display = "grid";
                document.getElementById("user-display").innerText = "Signed in as: " + TARGET_USER;
            } else {
                errorElement.innerText = "Invalid 2FA Verification Code.";
                errorElement.style.display = "block";
            }
        }
    </script>
</body>
</html>
